name: Release and Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and deploy to GHCR
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.namespace.outputs.value }}
    steps:
      - id: namespace
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth, merchant, social, coupon, order]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=foodhub-${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}/foodhub-${{ matrix.service }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: infrastructure/production.compose.yml,infrastructure/mysql/init/001-create-databases.sql
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_namespace }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_REGISTRY,IMAGE_TAG,REGISTRY_USERNAME,REGISTRY_TOKEN
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            test -f .env
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
            export IMAGE_REGISTRY IMAGE_TAG
            docker compose --env-file .env -f production.compose.yml pull
            docker compose --env-file .env -f production.compose.yml up -d --wait --wait-timeout 240 --remove-orphans
            docker image prune --force
