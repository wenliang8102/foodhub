server:
  port: ${SERVER_PORT:8103}

spring:
  application:
    name: foodhub-social
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/foodhub_social?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:foodhub_dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

foodhub:
  social:
    cache:
      post-detail-ttl-seconds: ${SOCIAL_POST_DETAIL_TTL_SECONDS:300}
      post-detail-jitter-seconds: ${SOCIAL_POST_DETAIL_JITTER_SECONDS:60}
      counter-ttl-seconds: ${SOCIAL_COUNTER_TTL_SECONDS:60}
      counter-jitter-seconds: ${SOCIAL_COUNTER_JITTER_SECONDS:15}
      null-ttl-seconds: ${SOCIAL_NULL_TTL_SECONDS:30}
